services:
  caddy:
    image: caddy:2.8-alpine
    container_name: travel_diary_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - travel_network
    deploy:
      resources:
        limits:
          memory: 64M

  db:
    image: postgres:16-alpine
    container_name: travel_diary_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_diary}
      POSTGRES_USER: ${POSTGRES_USER:-travel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_password_change_me}
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
      -c max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - travel_network
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z-cpuv1
    container_name: travel_diary_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password_change_me}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - travel_network
    deploy:
      resources:
        limits:
          memory: 192M

  # Optional Redis service (activated only if profile is specified: --profile with-redis)
  redis:
    image: redis:7-alpine
    container_name: travel_diary_redis
    restart: unless-stopped
    profiles:
      - with-redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - travel_network
    deploy:
      resources:
        limits:
          memory: 64M

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: travel_diary_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-travel_user}:${POSTGRES_PASSWORD:-travel_password_change_me}@db:5432/${POSTGRES_DB:-travel_diary}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-travel-diary-media}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_this_super_secret_access_jwt_key_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_super_secret_refresh_jwt_key_in_production}
    depends_on:
      - db
      - minio
    networks:
      - travel_network
    deploy:
      resources:
        limits:
          memory: 160M

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: travel_diary_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    depends_on:
      - api
    networks:
      - travel_network
    deploy:
      resources:
        limits:
          memory: 192M

networks:
  travel_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
